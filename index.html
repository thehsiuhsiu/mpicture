<!doctype html>
<html lang="zh-TW" data-theme-mode="system">
  <head>
    <meta charset="UTF-8" />
    <title>M-Picture</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#121212"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="images/icons/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="images/icons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="images/icons/favicon-16x16.png"
    />
    <script src="https://cdn.jsdelivr.net/npm/docx@7.1.0/build/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
  </head>

  <body>
    <header>
      <h1>M-Picture</h1>

      <div class="zip-controls">
        <div class="download-dropdown">
          <button id="generate" class="create-btn create-btn-disabled">
            <span class="material-symbols-outlined">file_save</span>
          </button>
          <div class="download-menu" id="downloadMenu">
            <button type="button" class="download-option" id="downloadDocx">
              <span class="material-symbols-outlined">description</span>
              <span>DOCX</span>
            </button>
            <button type="button" class="download-option" id="downloadPdf">
              <span class="material-symbols-outlined">picture_as_pdf</span>
              <span>列印/PDF</span>
            </button>
            <button type="button" class="download-option" id="downloadZip">
              <span class="material-symbols-outlined"
                >deployed_code_update</span
              >
              <span>打包照片</span>
            </button>
          </div>
        </div>
      </div>
    </header>
    <aside class="sidebar">
      <div class="toggle-container">
        <div class="labels">
          <span class="label" data-value="left">刑事案件</span>
          <span class="label" data-value="middle">交通事故</span>
        </div>
      </div>
      <div class="form-group" data-format="left">
        <label for="docTitleLeft">文件標題</label>
        <input
          type="text"
          id="docTitleLeft"
          class="sidebar-input"
          placeholder="刑案照片黏貼表"
          value="刑案照片黏貼表"
        />
      </div>
      <div class="form-group" data-format="middle">
        <label for="docTitleMiddle">文件標題</label>
        <input
          type="text"
          id="docTitleMiddle"
          class="sidebar-input"
          placeholder="非道路交通事故照片黏貼紀錄表"
          value="非道路交通事故照片黏貼紀錄表"
        />
      </div>
      <div class="form-group" data-format="left">
        <label for="zipPrefix">案 由</label>
        <input
          type="text"
          id="zipPrefix"
          class="sidebar-input"
          placeholder="竊盜案"
        />
      </div>
      <div class="form-group" data-format="left">
        <label for="caseUni">單 位</label>
        <input
          type="text"
          id="caseUni"
          class="sidebar-input"
          placeholder="公園前派出所"
        />
      </div>

      <div class="form-group-row" data-format="left middle right">
        <label for="caseDate" id="dateLabelText">攝影日期</label>
        <label class="switch">
          <input type="checkbox" id="dateModeSwitch" />
          <span class="slider"></span>
        </label>
        <span id="dateModeLabel"></span>
      </div>
      <div class="form-group" data-format="left middle right">
        <input
          type="text"
          id="caseDate"
          class="sidebar-input"
          placeholder="115/05/16 09:18"
        />
      </div>

      <div class="form-group" data-format="left" id="addressGroup">
        <label for="caseAddress" id="addressLabelText">攝影地址</label>
        <input
          type="text"
          id="caseAddress"
          class="sidebar-input"
          placeholder="東京都葛飾區龜有3丁目32番17號"
        />
      </div>

      <div class="form-group" data-format="left" id="personGroup">
        <label for="caseNumber" id="personLabelText">攝影人員</label>
        <input
          type="text"
          id="caseNumber"
          class="sidebar-input"
          placeholder="警員○○○"
        />
      </div>
    </aside>
    <main class="main-content">
      <div class="view-switch-container">
        <button
          type="button"
          id="gridViewBtn"
          class="view-btn active"
          title="格狀版面配置"
        >
          <span class="material-symbols-outlined">grid_view</span>
        </button>
        <button
          type="button"
          id="listViewBtn"
          class="view-btn"
          title="列表版面配置"
        >
          <span class="material-symbols-outlined">view_list</span>
        </button>
        <span class="toolbar-divider"></span>
        <div class="size-slider-container">
          <button type="button" id="sizeDecBtn" class="size-btn" title="縮小">
            <span class="material-symbols-outlined">remove</span>
          </button>
          <input
            type="range"
            id="photoSizeSlider"
            min="120"
            max="600"
            value="250"
            step="20"
          />
          <button type="button" id="sizeIncBtn" class="size-btn" title="放大">
            <span class="material-symbols-outlined">add</span>
          </button>
        </div>
        <div class="edit-tools-container">
          <button
            type="button"
            id="rotateLeftBtn"
            class="edit-tool-btn"
            title="向左旋轉90°"
            disabled
          >
            <span class="material-symbols-outlined">rotate_left</span>
          </button>
          <button
            type="button"
            id="rotateRightBtn"
            class="edit-tool-btn"
            title="向右旋轉90°"
            disabled
          >
            <span class="material-symbols-outlined">rotate_right</span>
          </button>
        </div>
      </div>
      <div class="container">
        <div id="imagePreview"></div>
      </div>
    </main>

    <div id="uploadingModal" class="modal">
      <div class="modal-content">
        <p>🚀 照片載入中，請稍候...</p>
        <div class="loader"></div>
      </div>
    </div>

    <div id="loadingModal" class="modal">
      <div class="modal-content">
        <p>🖨️ 照片黏貼中，請稍候...</p>
        <div class="loader"></div>
      </div>
    </div>
    <div id="zippingModal" class="modal">
      <div class="modal-content">
        <p>📦 照片打包中，請稍候...</p>
        <div class="loader"></div>
      </div>
    </div>
    <div id="conversionModal" class="modal">
      <div class="modal-content">
        <p>⚙️ 轉換.heic檔案中，請稍候...</p>
        <div class="loader"></div>
      </div>
    </div>

    <button class="fab-add-photo" id="fabAddPhoto" title="新增照片">
      <span class="material-symbols-outlined" style="font-size: 60px">add</span>
    </button>
    <input
      type="file"
      id="imageInput"
      multiple
      accept="image/*,.heic,.HEIC"
      style="display: none"
    />

    <script type="module" src="js/main.js"></script>

    <footer>
      <h3>🚧 Copyright© 2024 thehsiuhsiu. All rights reserved.🚧</h3>
      <p>本網頁內容由ChatGPT、Claude、Gemini及GitHub Copilot共同協作開發。</p>
      <div class="theme-selector">
        <button
          type="button"
          id="themeToggleBtn"
          class="theme-toggle-icon"
          title="切換主題"
        >
          <span class="material-symbols-outlined theme-icon-light"
            >light_mode</span
          >
          <span class="material-symbols-outlined theme-icon-dark"
            >dark_mode</span
          >
          <span class="material-symbols-outlined theme-icon-system"
            >contrast</span
          >
        </button>
        <div class="theme-menu" id="themeMenu">
          <button type="button" class="theme-option" data-theme="light">
            <span class="material-symbols-outlined">light_mode</span>
            <span>淺色模式</span>
          </button>
          <button type="button" class="theme-option" data-theme="dark">
            <span class="material-symbols-outlined">dark_mode</span>
            <span>深色模式</span>
          </button>
          <button type="button" class="theme-option" data-theme="system">
            <span class="material-symbols-outlined">contrast</span>
            <span>依系統設置</span>
          </button>
        </div>
      </div>
    </footer>

    <div id="resize-warning" class="modal">
      <div class="modal-content">
        <p>🔎提醒：網頁視窗過小！</p>
        <p>請放大視窗以確保獲得最佳體驗。</p>
      </div>
    </div>

    <!-- Toast notification -->
    <div id="toast-container" class="toast-container"></div>
  </body>
</html>
